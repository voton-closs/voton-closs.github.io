<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voton Closs - Premium Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* カッコいいダークモード風のスタイル（UIの変更） */
        :root {
            --bg-main: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --accent: #5865f2;
            --accent-hover: #4752c4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #chat-container { width: 100%; max-width: 800px; height: 85vh; background: var(--bg-chat); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        
        /* ヘッダー */
        .chat-header { background: var(--bg-sidebar); padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; }
        .chat-header h2 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
        .status-dot { width: 8px; height: 8px; background: #23a55a; border-radius: 50%; }

        /* メッセージ表示エリア */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        
        /* 個々のメッセージの装飾 */
        .message-wrapper { display: flex; flex-direction: column; gap: 4px; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-meta { display: flex; align-items: baseline; gap: 8px; }
        .username { font-weight: 600; color: #fff; font-size: 0.95rem; }
        .timestamp { font-size: 0.75rem; color: var(--text-muted); }
        .message-content { font-size: 0.95rem; line-height: 1.5; color: #dbdee1; white-space: pre-wrap; word-break: break-all; }

        /* 入力エリア */
        .input-area { background: var(--bg-chat); padding: 0 20px 20px 20px; display: flex; gap: 12px; }
        input { background: var(--bg-input); border: none; padding: 14px; color: var(--text-main); font-size: 0.95rem; border-radius: 8px; outline: none; }
        input::placeholder { color: var(--text-muted); }
        #username { width: 150px; border: 1px solid rgba(255,255,255,0.05); }
        #content { flex: 1; }
        button { background: var(--accent); color: white; border: none; padding: 0 20px; font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }

        /* スクロールバーのカスタマイズ */
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--bg-main); border-radius: 4px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <h2>Voton Closs - メインルーム</h2>
    </div>
    
    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="username" placeholder="ユーザー名" value="ゲスト">
        <input type="text" id="content" placeholder="メッセージを入力...">
        <button id="send-btn">送信</button>
    </div>
</div>

<script>
    // ⚠️ あなたのSupabaseの情報をここに再設定してください！
    const SUPABASE_URL = "https://buyvsppegdtlqtmtpyhi.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_vRtvGddqMZgGUR3Qs-F3AA_w0ruclrH";              

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messagesDiv = document.getElementById('messages');
    const usernameInput = document.getElementById('username');
    const contentInput = document.getElementById('content');
    const sendBtn = document.getElementById('send-btn');

    // 時間を「15:30」のような形式に変換する便利な関数
    function formatTime(isoString) {
        const date = new Date(isoString);
        return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }

    // 1. 過去のメッセージを読み込む
    async function loadMessages() {
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error('データ取得エラー:', error);
            return;
        }

        messagesDiv.innerHTML = '';
        data.forEach(msg => {
            appendMessage(msg.username, msg.content, msg.created_at);
        });
        scrollToBottom();
    }

    // 新機能：時間を表示できるように引数（createdAt）を追加！
    function appendMessage(username, content, createdAt) {
        const timeStr = createdAt ? formatTime(createdAt) : formatTime(new Date());
        
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        
        wrapper.innerHTML = `
            <div class="message-meta">
                <span class="username">${username || '名無し'}</span>
                <span class="timestamp">${timeStr}</span>
            </div>
            <div class="message-content">${content}</div>
        `;
        
        messagesDiv.appendChild(wrapper);
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 2. メッセージを送信する
    sendBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const content = contentInput.value.trim();

        if (!content) return;

        // DBに送信（created_atはSupabase側で自動生成されます）
        const { error } = await supabaseClient
            .from('messages')
            .insert([{ username: username, content: content }]);

        if (error) {
            alert('送信に失敗しました: ' + error.message);
        } else {
            contentInput.value = '';
        }
    });

    contentInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendBtn.click();
    });

    // 3. リアルタイム機能
    supabaseClient
        .channel('schema-db-changes')
        .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
                // リアルタイムで届いたデータからcreated_atを渡す
                appendMessage(payload.new.username, payload.new.content, payload.new.created_at);
                scrollToBottom();
            }
        )
        .subscribe();

    loadMessages();
</script>

</body>
</html>
